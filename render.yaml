services:
  - type: web
    name: world-translator-bot
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: WHISPER_MODEL
        value: tiny
      - key: MAX_DOWNLOAD_MB
        value: "20"
